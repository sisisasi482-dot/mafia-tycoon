name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: artifacts/constantine-mafia

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build game
        run: PORT=3000 BASE_PATH=/ pnpm run build

      - name: Sync Capacitor
        run: pnpm run cap:sync

      - name: Show Xcode schemes
        run: |
         cd ios/App
         xcodebuild -list -project App.xcodeproj 

         - name: Build iOS
          run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            build 
